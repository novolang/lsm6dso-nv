[package]
name        = "lsm6dso-nv"
version     = "0.1.0"
description = "A driver for ST's LSM6DSO six-axis inertial module on an I2C or an SPI bus: the acceleration in milli-g and the rate of turn in milli-degrees per second at the range and rate set, the output data rates and the high-performance and low-power modes, the data-ready pins, the FIFO in continuous mode as an option, the temperature, the self-tests and WHO_AM_I, as devices-nv's Accelerometer, Gyroscope, Imu, Thermometer and Identifiable."
license     = "Apache-2.0"
stability   = "experimental"
category    = "embedded"
layer       = "host"
tags        = ["lsm6dso", "lsm6dsox", "imu", "accelerometer", "gyroscope", "i2c", "spi", "sensor", "nrf52840-dk", "nrf54lm20-dk"]
repository  = "https://github.com/novolang/lsm6dso-nv"
maintainers = ["novo-lang"]
novo        = ">= 0.24.0"

[docs.pages]
"README.md" = "Reading an LSM6DSO six-axis IMU from a device program"

[dependencies]
# The board's I2C bus, SPI bus and GPIO handles, and the I2cBus, SpiBus
# and GpioOut traits they implement.
embedded-hal-nv = "^0.3.2"
# The wiring record a board's device table hands `attach`, the register
# helpers, and the Accelerometer, Gyroscope, Imu, Thermometer and
# Identifiable traits.
devices-nv      = "^0.3.2"
